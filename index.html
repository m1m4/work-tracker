<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Work Tracker</title>
    <meta name="theme-color" content="#fdf3e3" />
    <meta name="description" content="Weekly work hours logged from your Google Calendar." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png?v=9bbe3fa7" />
    <link rel="apple-touch-icon" href="icon-192.png?v=9bbe3fa7" />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Display face for headings and the big number only; body text stays on
         the system stack. display=swap so text paints before the font lands. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong one. Mirrors resolveTheme() in src/lib/theme.js.
      (function () {
        var theme = 'system'
        try {
          theme = (JSON.parse(localStorage.getItem('wt.settings') || '{}').theme) || 'system'
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
